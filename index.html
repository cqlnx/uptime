<!DOCTYPE html><html lang="en"><head><link rel="icon" type="image/x-icon" href="icon.svg"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>MineScan | Status</title><style>:root{--bg-color:#0d0e12;--text-color:#f3f4f6;--muted-text:#9ca3af;--accent-color:#3b82f6;--border-color:#1f2937;--block-bg:#111827;--warn-color:#f59e0b;--warn-bg:#1c1710;--warn-border:#3d2f13;--ok-color:#4ade80;--ok-bg:#0f1a14;--ok-border:#14351f;--down-color:#f87171;--down-bg:#1c1013;--down-border:#3d1313;--bar-up:#22c55e;--bar-down:#ef4444;}*{box-sizing:border-box;margin:0;padding:0;}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background-color:var(--bg-color);color:var(--text-color);line-height:1.6;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:40px 20px;}.container{max-width:550px;width:100%;}header{margin-bottom:32px;}h1{font-size:2rem;font-weight:700;letter-spacing:-0.05em;margin-bottom:6px;}.subtitle{color:var(--muted-text);font-size:1rem;}p{color:var(--muted-text);font-size:0.95rem;margin-bottom:16px;}p:last-child{margin-bottom:0;}a{color:var(--accent-color);text-decoration:none;font-weight:500;transition:opacity 0.2s;}a:hover{text-decoration:underline;opacity:0.9;}a:focus-visible,button:focus-visible{outline:2px solid var(--accent-color);outline-offset:2px;border-radius:4px;}.banner{border:1px solid var(--border-color);background-color:var(--block-bg);border-radius:8px;padding:14px 18px;margin-bottom:16px;}.banner h2{font-size:0.9rem;font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:8px;}.banner p{font-size:0.85rem;color:#d1d5db;margin-bottom:0;}.banner.ok{background-color:var(--ok-bg);border-color:var(--ok-border);}.banner.ok h2{color:var(--ok-color);}.banner.down{background-color:var(--down-bg);border-color:var(--down-border);}.banner.down h2{color:var(--down-color);}.banner.warn{background-color:var(--warn-bg);border-color:var(--warn-border);}.banner.warn h2{color:var(--warn-color);}section{background-color:var(--block-bg);border:1px solid var(--border-color);border-radius:8px;padding:24px;margin-bottom:20px;}h2{font-size:1.1rem;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px;}section h2.split{justify-content:space-between;margin-bottom:2px;}.target-url{font-size:0.82rem;color:var(--muted-text);margin-bottom:16px;word-break:break-all;}.pill{font-size:0.75rem;font-weight:600;padding:2px 10px;border-radius:999px;border:1px solid var(--border-color);color:var(--muted-text);white-space:nowrap;}.pill.up{color:var(--ok-color);background:var(--ok-bg);border-color:var(--ok-border);}.pill.down{color:var(--down-color);background:var(--down-bg);border-color:var(--down-border);}.pill.pending{color:var(--warn-color);background:var(--warn-bg);border-color:var(--warn-border);}.strip{display:flex;gap:2px;height:28px;}.strip.long{height:20px;gap:1px;}.bar{flex:1;min-width:0;border-radius:2px;background-color:var(--border-color);}.bar.up{background-color:var(--bar-up);}.bar.down{background-color:var(--bar-down);}.strip-labels{display:flex;justify-content:space-between;font-size:0.72rem;color:#4b5563;margin-top:4px;}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px;}.stat b{display:block;font-size:1rem;font-weight:600;color:var(--text-color);}.stat span{font-size:0.75rem;color:var(--muted-text);}@media (max-width:460px){.stats{grid-template-columns:repeat(2,1fr);}}.link-btn{background:none;border:0;color:var(--accent-color);font:inherit;font-size:0.82rem;font-weight:500;cursor:pointer;padding:0;margin-top:16px;}.link-btn:hover{text-decoration:underline;}.long-wrap{margin-top:12px;}.long-wrap .note{font-size:0.8rem;margin-bottom:8px;}.incidents{list-style:none;margin-bottom:0;}.incidents li{padding:12px 0;border-bottom:1px solid var(--border-color);margin-bottom:0;color:var(--muted-text);}.incidents li::before{content:none;}.incidents li:first-child{padding-top:0;}.incidents li:last-child{border-bottom:0;padding-bottom:0;}.inc-head{display:flex;justify-content:space-between;gap:12px;font-size:0.95rem;}.inc-head strong{color:var(--text-color);font-weight:600;}.inc-head .ongoing{color:var(--down-color);font-weight:600;}.inc-meta{font-size:0.82rem;color:var(--muted-text);}footer{margin-top:40px;text-align:center;font-size:0.8rem;color:#4b5563;}footer p{font-size:0.8rem;color:#4b5563;}</style></head><body><div class="container"><header><h1>MineScan Status</h1><p class="subtitle">Live uptime for MineScan services. <a href="https://minescan.xyz/">Back to MineScan &rarr;</a></p></header><main><div id="banner" role="status" aria-live="polite"></div><div id="stale"></div><div id="monitors"></div><section><h2>Recent Incidents</h2><div id="incidents"><p>Loading&hellip;</p></div></section></main><footer><p id="updated" style="margin-bottom:8px;"></p><p>&copy; 2026 MineScan &bull; Not affiliated with Mojang Studios &bull; <a href="https://minescan.xyz/legal">Legal</a> &bull; <a href="https://minescan.xyz/.well-known/security.txt">Security</a></p></footer></div><script> const API_BASE = "/api"; const REFRESH_MS = 60 * 1000; const STALE_MINUTES = 20; const STRIP_SIZE = 30; const LONG_STRIP_SIZE = 90; const MAX_INCIDENTS = 10; let status = null; let incidents = null; let loadFailed = false; const expanded = new Set(); const historyCache = {}; const $ = (sel) => document.querySelector(sel); const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); async function getJSON(path) { const res = await fetch(`${API_BASE}/${path}`, { cache: "no-store" }); if (!res.ok) throw new Error(`${path}: HTTP ${res.status}`); return res.json(); } function ago(iso) { if (!iso) return "never"; const s = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 1000)); if (s < 60) return `${s}s ago`; const m = Math.floor(s / 60); if (m < 60) return `${m}m ago`; const h = Math.floor(m / 60); if (h < 48) return `${h}h ${m % 60}m ago`; return `${Math.floor(h / 24)}d ago`; } function duration(startIso, endIso) { let s = Math.max(0, Math.round((new Date(endIso) - new Date(startIso)) / 1000)); if (s < 60) return `${s}s`; const m = Math.floor(s / 60); if (m < 60) return `${m}m ${s % 60}s`; const h = Math.floor(m / 60); if (h < 48) return `${h}h ${m % 60}m`; return `${Math.floor(h / 24)}d ${h % 24}h`; } const pct = (v) => (v == null ? "\u2014" : `${v}%`); const ms = (v) => (v == null ? "\u2014" : `${v} ms`); function strip(history, size, extraClass = "") { const items = (history || []).slice(-size); let bars = ""; for (let i = 0; i < size - items.length; i++) bars += '<span class="bar"></span>'; for (const h of items) { let tip = `${new Date(h.t).toLocaleString()}: ${h.up ? "Up" : "Down"}`; if (h.http_status) tip += `, HTTP ${h.http_status}`; if (h.latency_ms != null) tip += `, ${h.latency_ms} ms`; bars += `<span class="bar ${h.up ? "up" : "down"}" title="${esc(tip)}"></span>`; } return `<div class="strip ${extraClass}" role="img" aria-label="Recent check results, oldest to newest">${bars}</div>`; } function renderBanner() { const el = $("#banner"); if (loadFailed && !status) { el.innerHTML = `<div class="banner down"><h2>Couldn't load status data</h2><p>The status data is unavailable right now. This page will retry automatically.</p></div>`; return; } if (!status) { el.innerHTML = `<div class="banner"><h2>Loading status&hellip;</h2></div>`; return; } const list = status.monitors; const down = list.filter((m) => m.status === "down"); const pending = list.filter((m) => m.status === "pending" && !m.last_checked); if (down.length) { const names = down.map((m) => esc(m.name)).join(", "); el.innerHTML = `<div class="banner down"><h2>${down.length} of ${list.length} services down</h2><p>Affected: ${names}</p></div>`; } else if (pending.length === list.length) { el.innerHTML = `<div class="banner"><h2>Waiting for the first check</h2><p>Results will appear after the next scheduled run.</p></div>`; } else { el.innerHTML = `<div class="banner ok"><h2>All systems operational</h2><p>Every monitored service passed its latest check.</p></div>`; } } function renderStale() { const el = $("#stale"); if (!status) { el.innerHTML = ""; return; } const minutes = (Date.now() - new Date(status.generated_at).getTime()) / 60000; if (minutes > STALE_MINUTES) { el.innerHTML = `<div class="banner warn"><h2>Status data is out of date</h2><p>The last check finished ${esc(ago(status.generated_at))}. The scheduled checker may be delayed or paused, so the results below may not reflect the current state.</p></div>`; } else { el.innerHTML = ""; } } function renderMonitors() { const el = $("#monitors"); if (!status) { el.innerHTML = ""; return; } el.innerHTML = status.monitors.map((m) => { const isOpen = expanded.has(m.id); let longHtml = ""; if (isOpen) { const h = historyCache[m.id]; if (h === undefined) longHtml = `<div class="long-wrap"><p class="note">Loading history&hellip;</p></div>`; else if (h === "error") longHtml = `<div class="long-wrap"><p class="note">Couldn't load the longer history.</p></div>`; else longHtml = `<div class="long-wrap"><p class="note">Last ${Math.min(h.length, LONG_STRIP_SIZE)} checks</p>${strip(h, LONG_STRIP_SIZE, "long")}<div class="strip-labels"><span>Older</span><span>Latest</span></div></div>`; } return ` <section><h2 class="split"><span>${esc(m.name)}</span><span class="pill ${esc(m.status)}">${esc(m.status === "up" ? "Operational" : m.status === "down" ? "Down" : "Pending")}</span></h2><p class="target-url">${esc(m.url)}</p> ${strip(m.history, STRIP_SIZE)} <div class="strip-labels"><span>Older</span><span>Latest</span></div><div class="stats"><div class="stat"><b>${pct(m.uptime_24h)}</b><span>Uptime, 24h</span></div><div class="stat"><b>${pct(m.uptime_7d)}</b><span>Uptime, 7d</span></div><div class="stat"><b>${ms(m.latency_ms)}</b><span>Response time</span></div><div class="stat"><b title="${m.last_checked ? esc(new Date(m.last_checked).toLocaleString()) : ""}">${esc(ago(m.last_checked))}</b><span>Last checked</span></div></div><button class="link-btn" type="button" data-toggle="${esc(m.id)}" aria-expanded="${isOpen}">${isOpen ? "Hide history" : "Show more history"}</button> ${longHtml} </section>`; }).join(""); } function renderIncidents() { const el = $("#incidents"); if (incidents === null) { el.innerHTML = `<p>${loadFailed ? "Couldn't load incidents." : "Loading&hellip;"}</p>`; return; } if (!incidents.length) { el.innerHTML = `<p>No incidents recorded.</p>`; return; } const shown = incidents.slice(0, MAX_INCIDENTS); el.innerHTML = `<ul class="incidents">${shown.map((i) => ` <li><div class="inc-head"><strong>${esc(i.target_name)}</strong><span class="${i.ended_at ? "" : "ongoing"}">${i.ended_at ? "Resolved after " + esc(duration(i.started_at, i.ended_at)) : "Ongoing"}</span></div><div class="inc-meta">${esc(i.cause || "No details recorded")}</div><div class="inc-meta">${esc(new Date(i.started_at).toLocaleString())}</div></li>`).join("")}</ul>`; } function renderUpdated() { $("#updated").textContent = status ? `Last check finished ${ago(status.generated_at)}. Checks run about every 5 minutes.` : ""; } function render() { renderBanner(); renderStale(); renderMonitors(); renderIncidents(); renderUpdated(); } async function loadHistory(id) { try { const data = await getJSON(`history/${encodeURIComponent(id)}.json`); historyCache[id] = data.history || []; } catch (e) { historyCache[id] = "error"; } } async function load() { try { const [s, inc] = await Promise.all([ getJSON("status.json"), getJSON("incidents.json").catch(() => null), ]); status = s; if (inc) incidents = inc.incidents || []; loadFailed = false; await Promise.all([...expanded].map(loadHistory)); } catch (e) { console.error("[status] load failed:", e); loadFailed = true; } render(); } $("#monitors").addEventListener("click", async (e) => { const btn = e.target.closest("[data-toggle]"); if (!btn) return; const id = btn.dataset.toggle; if (expanded.has(id)) { expanded.delete(id); render(); } else { expanded.add(id); render(); await loadHistory(id); render(); } }); render(); load(); setInterval(load, REFRESH_MS); setInterval(render, 30 * 1000); </script></body></html>
